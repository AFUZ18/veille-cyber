# Qualité : lint + tests à chaque push / pull request, et vérification des flux à la demande.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      check_feeds:
        description: "Vérifier aussi que chaque flux RSS répond"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (pytest)
        run: pytest -q
      - name: Vérifier les flux RSS
        if: github.event_name == 'workflow_dispatch' && inputs.check_feeds
        run: python scripts/check_feeds.py --summary "$GITHUB_STEP_SUMMARY"
