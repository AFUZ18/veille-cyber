[project]
name = "veille-cyber"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B905", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/newsletter.py" = ["E501"]  # gabarits HTML e-mail
"scripts/kpi_doc.py" = ["E501"]  # gabarit de documentation

[tool.pytest.ini_options]
testpaths = ["tests"]
