# ---------------------------------------------------------------------------
# Les 9 cartes de la vue « Santé de la veille » (chantier 3)
# ---------------------------------------------------------------------------
#   id          : identifiant stable (ne pas modifier)
#   ordre       : position sur la page ; importance : 1 = le plus important
#                 (sert à classer le bloc « À traiter en premier »)
#   question    : question affichée
#   kpis        : KPI du référentiel utilisés (le premier donne la réponse)
#   pourquoi / que_faire : une ligne chacun
#   action_probleme : ligne utilisée dans « À traiter en premier » et l'issue de revue
#                     ({variables} remplies automatiquement)
#   estimation  : true si la valeur repose sur des notes saisies à la main
#   sans_donnees: phrase affichée quand la carte n'est pas encore mesurable
# Une carte « Pas encore de données » n'est jamais rouge ni orange et ne crée aucune action.
# ---------------------------------------------------------------------------
cartes:
  - id: sources
    ordre: 1
    importance: 1
    question: "Mes sources fonctionnent-elles ?"
    kpis: [B6_disponibilite_flux, B7_flux_en_erreur]
    chiffre: "{ok} sources sur {total} répondent"
    pourquoi: "Une source en panne, ce sont des alertes que vous ne recevez pas."
    que_faire: "Corriger l'adresse des sources en panne ou les désactiver dans la configuration."
    action_probleme: "Corriger ou désactiver les {ko} sources en panne (liste dans « En détail » de la carte)."
    estimation: false
    sans_donnees: "Aucune collecte n'a encore été enregistrée."

  - id: rapidite
    ordre: 2
    importance: 4
    question: "Reçoit-on les informations assez vite ?"
    kpis: [B5_delai_reception]
    chiffre: "La moitié des articles arrive en moins de {heures} heures"
    pourquoi: "Une alerte reçue tard laisse moins de temps pour réagir."
    que_faire: "Vérifier que la mise à jour automatique tourne bien toutes les 6 heures."
    action_probleme: "Les articles arrivent en {heures} h : vérifier la fréquence de mise à jour automatique."
    estimation: false
    sans_donnees: "Il faut au moins une journée de collecte pour mesurer la rapidité."

  - id: utilite_articles
    ordre: 3
    importance: 3
    question: "Les articles sont-ils utiles ?"
    kpis: [A1_pertinence_axe]
    chiffre: "{dixiemes} articles sur 10 correspondent à vos sujets"
    pourquoi: "Moins d'articles inutiles, c'est moins de temps perdu."
    que_faire: "Retirer les sources ou mots-clés qui apportent surtout du bruit."
    action_probleme: "Seulement {dixiemes} articles sur 10 sont utiles : retirer les sources qui apportent du bruit."
    estimation: false
    sans_donnees: "Pas encore assez d'articles cette semaine."

  - id: couverture
    ordre: 4
    importance: 5
    question: "Chaque sujet est-il bien couvert ?"
    kpis: [A2_couverture_axe]
    chiffre: "{faible_nom} est le sujet le moins couvert ({faible_n} articles pour un objectif de {faible_cible})"
    chiffre_ok: "Tous les sujets atteignent leur objectif de la semaine"
    pourquoi: "Un sujet peu couvert, ce sont des risques que l'on ne voit pas."
    que_faire: "Ajouter une source spécialisée sur le sujet le moins couvert."
    action_probleme: "Le sujet {faible_nom} est sous-couvert : ajouter une source spécialisée."
    estimation: false
    sans_donnees: "Pas encore assez d'articles cette semaine."

  - id: confirmation
    ordre: 5
    importance: 6
    question: "Les infos importantes sont-elles confirmées ?"
    kpis: [B3_taux_recoupement]
    chiffre: "{dixiemes} alertes importantes sur 10 sont confirmées par au moins 2 sources"
    pourquoi: "Une alerte confirmée par plusieurs sources est plus sûre."
    que_faire: "Recouper les alertes isolées avec l'avis officiel (CERT-FR, éditeur)."
    action_probleme: "Trop d'alertes non confirmées : ajouter une source officielle ou de presse indépendante."
    estimation: false
    sans_donnees: "Aucune alerte importante cette semaine : rien à confirmer."

  - id: fiabilite_sources
    ordre: 6
    importance: 7
    question: "Les sources sont-elles fiables ?"
    kpis: [B1_qualite_moyenne, B2_qualite_source]
    chiffre: "Note moyenne des sources : {moyenne} sur 100"
    pourquoi: "Des sources fiables évitent de relayer de fausses alertes."
    que_faire: "Remplacer les sources les moins bien notées si elles restent faibles."
    action_probleme: "Sources peu fiables : remplacer {faibles}."
    estimation: true
    sans_donnees: "Aucune source n'a publié sur la période."

  - id: diversite
    ordre: 7
    importance: 8
    question: "La veille est-elle variée ?"
    kpis: [F1_part_max_source, F5_part_sources_francaises, E1_repartition_langues, F2_concentration_hhi, F4_repartition_geographique]
    chiffre: "{anglais} % d'articles en anglais, {francais} % de sources françaises, {top} % pour la source la plus présente"
    message: "Veille très anglophone et surtout américaine ({pays_top} % des articles)."
    pourquoi: "Une veille peu variée voit moins bien les sujets français et européens."
    que_faire: "Ajouter des sources françaises et européennes."
    action_probleme: "Veille peu variée : ajouter des sources françaises et limiter la source dominante ({top_nom})."
    estimation: false
    sans_donnees: "Pas encore assez d'articles cette semaine."

  - id: usage
    ordre: 8
    importance: 2
    question: "La veille sert-elle à quelque chose ?"
    kpis: [D1_utilisations, D2_signaux_transformes, D3_taux_transformation, A3_temps_hors_sujet]
    chiffre: "{n} utilisation(s) déclarée(s) en 30 jours"
    pourquoi: "Une veille qui ne sert pas doit être réorientée."
    que_faire: "Cliquez sur « Signaler un usage » (dans les détails d'un article) dès qu'une information vous sert."
    action_probleme: "La veille est peu utilisée : la présenter aux équipes et déclarer chaque usage."
    estimation: false
    sans_donnees: "Personne n'a encore déclaré d'usage. Dès qu'un article vous sert (alerte, correctif, note), cliquez sur « Signaler un usage » dans ses détails."

  - id: emergents
    ordre: 9
    importance: 9
    question: "Repère-t-on des sujets émergents ?"
    kpis: [C1_signaux_faibles]
    chiffre: "{n} sujet(s) émergent(s) repéré(s) cette semaine"
    pourquoi: "Repérer tôt un sujet laisse le temps de s'y préparer."
    que_faire: "Lire les sujets émergents et noter une hypothèse pour chacun."
    action_probleme: ""
    estimation: false
    sans_donnees: "La détection démarre le {debut} (une semaine d'historique) et sera fiable à partir du {fiable}."
