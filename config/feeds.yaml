    language: en
    priority: 2
    enabled: true
  - name: "Magnet Forensics Blog"
    url: "https://www.magnetforensics.com/feed/"
    theme: H2
    language: en
    priority: 3
    enabled: true
  - name: "13Cubed (YouTube)"
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCy8ntxFEudOCRZYqDm4j3NA"
    theme: H2
    language: en
    priority: 3
    enabled: true
    note: "identifiant de chaîne à confirmer (voir README, § Ajouter une chaîne YouTube)"
  - name: "Velociraptor - releases"
    url: "https://github.com/Velocidex/velociraptor/releases.atom"
    theme: H2
    language: en
    priority: 2
    enabled: true
  - name: "Volatility 3 - releases"
    url: "https://github.com/volatilityfoundation/volatility3/releases.atom"
