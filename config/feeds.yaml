# ---------------------------------------------------------------------------
# Flux RSS / Atom de la veille.
# Champs : name, url, theme (H1|H2|H3|H4|EVENTS ou liste), language (fr|en),
#          priority (1 = prioritaire … 3 = secondaire), enabled (true|false)
#          note (facultatif, pour vous).
#
# Vérification : lancez `python scripts/check_feeds.py` (ou le workflow
# « Vérifier les flux ») : il teste chaque URL et indique les flux en panne.
# Le pipeline ne s'arrête jamais si un flux échoue : l'état de chaque flux
# est visible en bas du site (section « Santé des sources »).
# ---------------------------------------------------------------------------

feeds:
  # ===================== H1 - Cloud =====================
  - name: "AWS Security Blog"
    url: "https://aws.amazon.com/blogs/security/feed/"
    theme: H1
    language: en
    priority: 2
    enabled: true
  - name: "Microsoft Security Blog"
    url: "https://www.microsoft.com/en-us/security/blog/feed/"
    theme: [H1, H4]
    language: en
    priority: 2
    enabled: true
  - name: "Google Cloud - Security & Identity"
    url: "https://cloudblog.withgoogle.com/products/identity-security/rss/"
    theme: H1
    language: en
    priority: 2
    enabled: true
  - name: "Cloud Security Alliance"
    url: "https://cloudsecurityalliance.org/blog/feed/"
    theme: H1
    language: en
    priority: 3
    enabled: true
    note: "à confirmer par check_feeds.py"
  - name: "Wiz Blog"
    url: "https://www.wiz.io/feed/rss.xml"
    theme: H1
    language: en
    priority: 2
    enabled: true
  - name: "Sysdig Blog"
    url: "https://sysdig.com/feed/"
    theme: H1
    language: en
    priority: 3
    enabled: true
  - name: "Unit 42 (Palo Alto Networks)"
    url: "https://unit42.paloaltonetworks.com/feed/"
    theme: [H1, H2]
    language: en
    priority: 1
    enabled: true
  - name: "Orca Security Blog"
    url: "https://orca.security/feed/"
    theme: H1
    language: en
    priority: 3
    enabled: true

