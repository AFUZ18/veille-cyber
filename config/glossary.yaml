# ---------------------------------------------------------------------------
# Glossaire bilingue FR / EN (maîtrise du risque de double traduction)
# ---------------------------------------------------------------------------
# Chaque concept regroupe ses équivalents français et anglais et leurs synonymes.
#   id    : identifiant stable (minuscules, tirets), affiché dans les signaux faibles
#   label : libellé français affiché
#   axes  : axes H1-H4 auxquels le concept rattache un article
#   fr/en : termes ; la recherche ignore majuscules et accents et tolère le pluriel
#
# Un article en français et un article en anglais sur le même sujet sont ainsi
# rattachés au même concept, aux mêmes axes, et comptés ensemble pour les
# signaux faibles. Pré-rempli : à enrichir librement.
# ---------------------------------------------------------------------------

concepts:
  # ---------------- H1 Cloud
  - {id: mauvaise-configuration, label: "Mauvaise configuration", axes: [H1],
     fr: [mauvaise configuration, erreur de configuration, configuration erronée], en: [misconfiguration, misconfigured, insecure configuration]}
  - {id: gestion-identites, label: "Gestion des identités et des accès", axes: [H1],
     fr: [gestion des identités, gestion des accès, fédération d'identité], en: [identity and access management, IAM, identity federation, workload identity]}
  - {id: conteneurs, label: "Conteneurs et orchestration", axes: [H1],
     fr: [conteneur, orchestrateur], en: [container, Kubernetes, k8s, Docker, container escape]}
  - {id: stockage-expose, label: "Stockage exposé", axes: [H1],
     fr: [stockage exposé, compartiment public, données exposées], en: [exposed bucket, public bucket, S3 bucket, exposed storage, open database]}
  - {id: cloud-souverain, label: "Cloud souverain", axes: [H1],
     fr: [cloud souverain, cloud de confiance, souveraineté numérique], en: [sovereign cloud, SecNumCloud, data sovereignty]}
  - {id: secrets-exposes, label: "Secrets et clés exposés", axes: [H1, H4],
     fr: [fuite de secrets, clés d'accès exposées, identifiants exposés], en: [leaked secrets, exposed credentials, hardcoded credentials, access keys exposed, secret leakage]}

