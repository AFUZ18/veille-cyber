# Phrases « pourquoi / que faire » utilisées quand aucun résumé IA n'est disponible.
# La première règle qui s'applique est retenue (ordre de la liste).
raisons_auto:
  - condition: pirates            # faille déjà exploitée (catalogue CISA)
    pourquoi: "Cette faille est déjà utilisée par des pirates."
    que_faire: "Vérifiez si vous utilisez ce produit et appliquez le correctif sans attendre."
  - condition: rancongiciel
    pourquoi: "Il s'agit d'une attaque par rançongiciel, qui peut bloquer toute une entreprise."
    que_faire: "Vérifiez vos sauvegardes et les accès à distance de vos clients."
  - condition: faille_grave       # niveau Urgent ou Important avec une faille citée
    pourquoi: "Faille grave dans un logiciel répandu."
    que_faire: "Vérifiez si vous êtes concerné et planifiez la mise à jour."
  - condition: source_officielle
    pourquoi: "Alerte publiée par une autorité officielle."
    que_faire: "Lisez l'avis et vérifiez les produits concernés."
  - condition: urgent
    pourquoi: "Sujet classé urgent par la veille."
    que_faire: "Lisez l'article et vérifiez si vos clients sont exposés."
  - condition: important
    pourquoi: "Sujet important pour les entreprises."
    que_faire: "Lisez l'article quand vous avez un moment."

